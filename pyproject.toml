[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beep"
version = "2025.2.5"
description = "beep is a python package supporting Battery Estimation and Early Prediction of battery cycle life."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Energy and Materials - Toyota Research Institute"}
]
maintainers = [
    {name = "Energy and Materials - Toyota Research Institute"}
]
keywords = [
    "materials", "battery", "chemistry", "science",
    "electrochemistry", "energy", "AI", "artificial intelligence"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "monty[yaml]>=2024.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "tqdm>=4.66",
    "boto3>=1.34",
    "botocore>=1.34",
    "pytz>=2024.1",
    "watchtower>=3.2",
    "msgpack-python>=0.5.6",
    "python-dateutil>=2.9",
    "ruamel.yaml>=0.18",
    "xmltodict>=0.13",
    "pydash>=8.0",
    "lmfit>=1.3",
    "click>=8.1",
    "matplotlib>=3.7",
    "h5py>=3.11",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "memory_profiler>=0.61",
    "requests",
]
dev = [
    "beep[test]",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs-material>=9.1",
    "mkdocstrings>=0.18",
]

[project.scripts]
beep = "beep.cmd:cli"

[project.urls]
Homepage = "https://github.com/TRI-AMDD/beep"
Repository = "https://github.com/TRI-AMDD/beep"
Documentation = "https://github.com/TRI-AMDD/beep"

[tool.setuptools.packages.find]
include = ["beep*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.mps", "*.csv", "*.json", "*.000", "*.txt", "*.sdu"]

# ============================================================================
# Ruff - Fast Python linter and formatter (replaces flake8, pycodestyle, isort, black)
# ============================================================================
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["beep"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "NPY",    # NumPy-specific rules
    "PD",     # pandas-vet
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name
    "B008",   # function calls in argument defaults
    "B905",   # zip without strict
    "PD901",  # df is a bad variable name
    "PD011",  # use .to_numpy() instead of .values
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__
"tests/*" = ["B011"]       # assert False
"beep/tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["beep"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# Mypy - Static type checking
# ============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "deprecated/",
]

# ============================================================================
# Pytest
# ============================================================================
[tool.pytest.ini_options]
addopts = "--durations=30 --quiet --ignore=beep/tests/test_files/raw"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
]
testpaths = ["beep/tests"]

# ============================================================================
# Coverage
# ============================================================================
[tool.coverage.run]
source = ["beep"]
omit = [
    "*/tests/*",
    "*/deprecated/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
