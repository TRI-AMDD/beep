name: Linting

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff linting
        run: |
          ruff check beep --output-format=github

      - name: Ruff format check
        run: |
          ruff format --check beep
        continue-on-error: true  # Don't fail on formatting issues (yet)

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy numpy pandas-stubs types-requests

      - name: Run mypy
        run: |
          mypy beep --ignore-missing-imports
        continue-on-error: true  # Don't fail on type errors (yet)
